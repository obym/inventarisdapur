    <script>
      (function() {
        try {
          var nativeFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          if (nativeFetch) {
            var activeFetch = nativeFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return activeFetch;
              },
              set: function(fn) {
                if (typeof fn === 'function') {
                  activeFetch = fn;
                }
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn('Fetch guard init:', e);
        }
      })();
    </script>
